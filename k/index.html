<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>鍵コード | Xeno Dungeons</title>
<meta name="description" content="Xeno Dungeons（ゼノダン）の鍵コード。アプリの倉庫の「鍵」で入力すると、同じダンジョンに挑めます。">
<style>
 body { margin: 0; background: radial-gradient(ellipse at 50% 30%, #3a2a0e, #0e0802 60%, #000); color: #ece8df; min-height: 100vh;
   font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif; display: flex; align-items: center; justify-content: center; }
 main { max-width: 420px; padding: 24px 18px; text-align: center; }
 h1 { color: #ffd75a; font-size: 1.5rem; margin: 0 0 8px; letter-spacing: .08em; }
 p { color: #c9c2ad; line-height: 1.7; margin: 8px 0; }
 .code { margin: 18px 0; padding: 14px; border: 2px solid #c8871e; border-radius: 8px; background: #1a1208; font-family: ui-monospace, Menlo, Consolas, monospace;
   font-size: 1.05rem; color: #fff; word-break: break-all; user-select: all; }
 button, a.btn { display: inline-block; margin: 6px; padding: 10px 18px; border-radius: 6px; border: 1px solid #ffd75a; background: #ffd75a; color: #2a1600;
   font-weight: 700; font-size: 1rem; text-decoration: none; cursor: pointer; }
 a.btn.ghost { background: transparent; color: #ffd75a; }
 .note { font-size: .85rem; color: #9d97ad; }
</style></head>
<body><main>
<h1>鍵コード</h1>
<p>Xeno Dungeons（ゼノダン）の鍵コードです。アプリの<b>倉庫 → 鍵</b>で入力すると、同じダンジョンに挑めます。</p>
<div class="code" id="code">—</div>
<button id="copy">コードをコピー</button>
<a class="btn ghost" href="https://apps.apple.com/app/id6833010551">App Store で見る</a>
<p class="note">アプリが入っている iPhone では、このリンクを開くとアプリの鍵の画面が開きます。</p>
</main>
<script>
const c = new URLSearchParams(location.search).get('c') || ''
const ok = /^XD\d-[A-Za-z0-9-]{4,200}$/.test(c)
document.getElementById('code').textContent = ok ? c : 'コードが見つかりません'
document.getElementById('copy').onclick = async () => { if (!ok) return; try { await navigator.clipboard.writeText(c); document.getElementById('copy').textContent = 'コピーしました' } catch { } }
if (!ok) document.getElementById('copy').disabled = true
</script>
</body></html>

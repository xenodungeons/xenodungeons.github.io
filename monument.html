<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伝説の石碑 | Xeno Dungeons</title>
<meta name="description" content="Xeno Dungeons（ゼノダン）の伝説の石碑。神器を最初に見つけた人の名（プレイヤー名とギルド名）が刻まれています。">
<meta property="og:title" content="伝説の石碑 | Xeno Dungeons">
<meta property="og:description" content="神器を最初に見つけた人の名（プレイヤー名とギルド名）が刻まれています。">
<style>
  :root { --bg: #14121c; --card: #1f1c2b; --line: #3a3550; --fg: #ece8df; --muted: #9d97ad; --gold: #f2c14e; --star: #ffa040; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif; line-height: 1.6; }
  main { max-width: 880px; margin: 0 auto; padding: 24px 14px 64px; }
  h1 { font-size: 1.6rem; margin: 0; color: var(--gold); letter-spacing: .05em; }
  .lead { color: var(--muted); margin: 6px 0 18px; }
  .count { font-size: 1.1rem; margin: 0 0 14px; }
  .count b { color: var(--gold); font-size: 1.5rem; }
  h2 { font-size: 1.05rem; margin: 28px 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .cell { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-height: 64px; }
  .cell .name { font-weight: 700; color: var(--star); }
  .cell.unknown .name { color: var(--muted); font-weight: 400; }
  .cell .who { font-size: .85rem; color: var(--fg); }
  .cell .when { font-size: .78rem; color: var(--muted); }
  ol.recent { list-style: none; padding: 0; margin: 0; }
  ol.recent li { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
  ol.recent .t { color: var(--muted); min-width: 7.5em; }
  ol.recent .n { color: var(--star); }
  .status { color: var(--muted); }
  .cta { display: inline-block; margin-top: 24px; padding: 10px 18px; border: 1px solid var(--gold); border-radius: 6px; color: var(--gold); text-decoration: none; }
  footer { margin-top: 36px; color: var(--muted); font-size: .82rem; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>伝説の石碑</h1>
<p class="lead">Xeno Dungeonsの世界で神器を発見したプレイヤーの名前（プレイヤー名とギルド名）が刻まれる石碑です。まだ誰にも発見されていない神器は「？」で表示されます。</p>
<p class="count" id="count">読み込み中…</p>

<h2>新しい発見</h2>
<ol class="recent" id="recent"><li class="status">読み込み中…</li></ol>

<h2>神器の一覧</h2>
<div class="grid" id="grid"></div>

<a class="cta" href="https://apps.apple.com/app/id6833010551">App Store で Xeno Dungeons を見る</a>

<footer>
  <p>石碑に表示される名前は、各プレイヤーがゲーム内で登録した「プレイヤー名（ギルド名）」です。<a href="./privacy.html">プライバシーポリシー</a>・<a href="./support.html">サポート</a></p>
</footer>
</main>
<script>
const SERVER = 'https://drjfnkhrndadlansxkxl.supabase.co'
const KEY = 'sb_publishable_mwnGd4mZtq7NScuHG0oiwA_6TQ62h42'
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
// 神器の名前は出さず、種類だけ見せる
const label = (x) => (x && x.heart ? '☆？？？の心' : `☆？${x ? x.shape : ''}`)
const day = (iso) => { const d = new Date(iso); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}` }
async function get(path) {
  const r = await fetch(`${SERVER}/rest/v1/${path}`, { headers: { apikey: KEY, Authorization: `Bearer ${KEY}` } })
  if (!r.ok) throw new Error(String(r.status))
  return r.json()
}
async function main() {
  try {
    const [items, recent] = await Promise.all([
      get('monument_items?select=item_id,kind,shape,heart,sort,discovered,first_finder,first_found_at,finders&order=sort'),
      get('monument?select=item_id,serial,found_at,finder_display&limit=30'),
    ])
    const found = items.filter((x) => x.discovered).length
    document.getElementById('count').innerHTML = `発見済み <b>${found}</b> / 全 ${items.length}`
    const byId = new Map(items.filter((x) => x.item_id).map((x) => [x.item_id, x]))
    document.getElementById('recent').innerHTML = recent.length
      ? recent.map((r) => `<li><span class="t">${day(r.found_at)}</span><span><span class="n">${esc(label(byId.get(r.item_id)))}</span>（${r.serial}人目）— ${esc(r.finder_display)}</span></li>`).join('')
      : '<li class="status">まだ発見はありません。</li>'
    document.getElementById('grid').innerHTML = items.map((x) => x.discovered
      ? `<div class="cell"><div class="name">${esc(label(x))}</div><div class="who">最初の発見者：${esc(x.first_finder)}${x.finders > 1 ? `　ほか${x.finders - 1}人` : ''}</div><div class="when">${day(x.first_found_at)}</div></div>`
      : `<div class="cell unknown"><div class="name">☆？${esc(x.shape)}</div><div class="when">まだ誰も見つけていない</div></div>`).join('')
  } catch (e) {
    document.getElementById('count').textContent = '石碑を読み込めませんでした。しばらくしてから、ページを再読み込みしてください。'
    document.getElementById('recent').innerHTML = ''
  }
}
main()
</script>
</body>
</html>
